<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan | Briking Nyus</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc; color: #1e293b; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .container { max-width: 400px; text-align: center; }
    .code { 
      font-size: 8rem; font-weight: 800; color: #e94560; line-height: 1;
      background: linear-gradient(135deg, #e94560, #d63a55);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1e293b; }
    p { color: #64748b; margin-bottom: 2rem; line-height: 1.6; }
    .btn { 
      display: inline-block; padding: 0.875rem 2rem; background: #e94560; color: white;
      border-radius: 0.5rem; text-decoration: none; font-weight: 600; transition: all 0.2s;
    }
    .btn:hover { background: #d63a55; transform: translateY(-1px); }
    .links { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap; }
    .links a { color: #64748b; text-decoration: none; font-size: 0.875rem; }
    .links a:hover { color: #e94560; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f1f5f9; }
      h1 { color: #f1f5f9; }
      p { color: #94a3b8; }
      .links a { color: #94a3b8; }
      .links a:hover { color: #e94560; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Maaf, halaman yang Anda cari tidak ada atau telah dipindahkan.</p>
    <a href="/" class="btn">Kembali ke Beranda</a>
    <div class="links">
      <a href="/search">Cari Berita</a>
      <a href="/category/hot">Berita Terbaru</a>
      <a href="/contact">Hubungi Kami</a>
    </div>
  </div>
  <script>
    // Redirect to SPA after 3 seconds
    setTimeout(() => {
      window.location.href = '/';
    }, 3000);
  </script>
</body>
</html>
