# Netlify Configuration for Briking Nyus
# Deploy: Connect repository to Netlify, build command: npm run build, publish directory: dist

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# SPA redirect for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com https://kit.fontawesome.com https://ka-f.fontawesome.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ka-f.fontawesome.com; font-src 'self' https://fonts.gstatic.com https://ka-f.fontawesome.com; img-src 'self' data: https:; connect-src 'self' https://newsapi.org https://gnews.io https://newsdata.io https://api.allorigins.win; frame-src 'self' https://www.youtube.com;"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Compression
[functions]
  node_bundler = "esbuild"
  included_files = ["src/services/**"]

# Edge functions for SEO (optional)
# [[edge_functions]]
#   path = "/article/*"
#   function = "seo-render"

# Environment variables (set in Netlify dashboard)
# VITE_NEWS_API_KEY
# VITE_GNEWS_API_KEY
# VITE_NEWSDATA_API_KEY
# VITE_SENTRY_DSN
# VITE_GA_ID

# Forms (for contact form)
[forms]
  contact = true
  newsletter = true

# Split testing (optional)
# [split_testing]
#   enabled = true

# Analytics (optional)
# [analytics]
#   enabled = true