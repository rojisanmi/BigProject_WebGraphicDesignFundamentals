    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json" id="structured-data">

      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Briking Nyus",
      "url": "https://brikingnyus.com/",
      "description": "Portal berita terpercaya Indonesia",
      "inLanguage": "id-ID",
      "publisher": {
        "@type": "Organization",
        "name": "Briking Nyus",
        "logo": {
          "@type": "ImageObject",
          "url": "https://brikingnyus.com/logo.png"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://brikingnyus.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
